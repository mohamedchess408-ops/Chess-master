<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Mastery</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at top,#172238 0,#0b1018 48%,#070a0f 100%);color:#f4f7fb;max-width:1220px;margin:auto;padding:28px 22px}
h1{font-size:38px;letter-spacing:-1px;margin:0 0 4px}
h2{margin:10px 0 8px}h3{margin:8px 0}
.card{background:rgba(18,24,34,.96);padding:22px;border-radius:18px;margin:16px 0;border:1px solid #2b3545;box-shadow:0 10px 30px rgba(0,0,0,.22)}
button{padding:10px 15px;border:1px solid #4d6b55;border-radius:9px;background:linear-gradient(#3d8658,#2f7048);color:#fff;font-weight:750;cursor:pointer;transition:.15s}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px 13px;margin:6px 0 12px;background:#0d131c;color:#f4f7fb;border:1px solid #303c4d;border-radius:9px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#5c8f69;box-shadow:0 0 0 3px rgba(92,143,105,.15)}
textarea{min-height:160px;resize:vertical}
.muted{color:#99a7ba}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.chapter{padding:10px;border:1px solid #303c4d;border-radius:9px;margin:7px 0}
.courseView{display:grid;grid-template-columns:minmax(360px,600px) minmax(280px,1fr);gap:28px;align-items:start}
.boardPanel{background:#10161f;border:1px solid #2c3746;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.board{width:500px;max-width:100%;margin:0 auto}.boardPanel{width:100%;max-width:530px;margin:0 auto}
.moves{max-height:580px;overflow:auto;background:#0d131b;padding:14px;border-radius:12px;border:1px solid #2b3542;line-height:1.9}
.move{display:inline-block;padding:5px 7px;border-radius:6px;cursor:pointer;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
.move:hover{background:#202a36}.move.active{background:#4f7f3e;color:#fff}
.realBoard{width:500px;max-width:100%;aspect-ratio:1;border:6px solid #19130f;border-radius:7px;overflow:hidden;display:grid;grid-template-columns:repeat(8,1fr);box-shadow:0 0 0 1px #5b3d29,0 4px 12px rgba(0,0,0,.35);background:#19130f}
.sq{display:flex;align-items:center;justify-content:center;position:relative;font-size:clamp(38px,7vw,76px);line-height:1;user-select:none;font-family:"Segoe UI Symbol","Noto Sans Symbols 2",DejaVu Sans,serif;transition:filter .12s}
.light{background:#e7c892}.dark{background:#9b633b}
.sq:hover{filter:brightness(1.08)}
.piece-white{color:#f8f0d8;text-shadow:0 1px 0 #fff,0 2px 0 #b99e6d,0 3px 5px rgba(0,0,0,.72);filter:drop-shadow(0 0 1px #8d6b3f)}
.piece-black{color:#171b22;text-shadow:0 1px 0 #6d727a,0 2px 0 #050607,0 3px 5px rgba(0,0,0,.85);filter:drop-shadow(0 0 1px #000)}
.fileLabel,.rankLabel{font-size:11px;position:absolute;font-family:Arial,sans-serif;font-weight:800;opacity:.9;text-shadow:none;pointer-events:none}
.light .fileLabel,.light .rankLabel{color:#75472d}.dark .fileLabel,.dark .rankLabel{color:#f0d29b}
.rankLabel{top:3px;left:5px}.fileLabel{bottom:3px;right:5px}
@media(max-width:800px){body{padding:18px 12px}.courseView{grid-template-columns:1fr}.board{max-width:580px}}
</style></head><body><h1>♟ Chess Mastery</h1><p class="muted">Your chess training platform.</p><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script>
let me=null;
const A=async(u,o={})=>{let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j};
async function render(){
 me=(await A('/api/me')).user;let c=await A('/api/courses');
 document.getElementById('app').innerHTML=(me?'<div class="card welcome"><h2>♟ Welcome back, '+me.name+'!</h2><p class="muted">Your Chess Mastery account is ready. Continue learning, review your courses, and keep improving your chess.</p><div class="row"><span class="muted">♙ Chess username: <b>'+((me.chess_username||'Not added'))+'</b></span><span class="muted">✉ Contact: <b>'+((me.contact||'Not added'))+'</b></span><button onclick="showProfile()">Edit profile</button><button onclick="logout()">Logout</button></div></div>':'<div class="card"><h2>Login</h2><input id="e" placeholder="Email"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button><h2>Register</h2><input id="n" placeholder="Name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password (8+)"><input id="ch" placeholder="Lichess / Chess.com username"><input id="co" placeholder="WhatsApp / contact"><button onclick="reg()">Create account</button></div>')
 +'<h2>Courses</h2>'+c.map(x=>'<div class="card"><h3>'+x.title+'</h3><p>'+x.description+'</p><b>$'+(x.price_cents/100).toFixed(2)+'</b><p>'+x.chapter_count+' chapters</p><button onclick="openC('+x.id+')">Open</button></div>').join('')
 +(me?.role==='admin'?'<div class="card"><h2>Admin</h2><h3>PayPal Settings</h3><p class="muted">Add your PayPal app credentials here. They are stored server-side and never shown back.</p><input id="pi" placeholder="PayPal Client ID"><input id="ps" type="password" placeholder="PayPal Client Secret"><select id="pe"><option value="sandbox">Sandbox</option><option value="live">Live</option></select><button onclick="savePayPal()">Save PayPal</button><div id="ppstatus"></div><hr><h2>Courses</h2><input id="ct" placeholder="Course title"><input id="cd" placeholder="Description"><input id="cp" type="number" step=".01" value="29.99"><input id="cf" type="number" value="1"><textarea id="pg" placeholder="Paste PGN"></textarea><button onclick="createC()">Create course</button></div>':'');
}
async function login(){try{await A('/api/auth/login',{method:'POST',body:JSON.stringify({email:e.value,password:p.value})});render()}catch(x){alert(x.message)}}
async function reg(){try{await A('/api/auth/register',{method:'POST',body:JSON.stringify({name:n.value,email:re.value,password:rp.value,chess_username:ch.value,contact:co.value})});render()}catch(x){alert(x.message)}}
async function logout(){await A('/api/auth/logout',{method:'POST'});render()}
function showProfile(){document.getElementById('app').insertAdjacentHTML('afterbegin','<div class="card" id="profileCard"><h2>✏ Edit your profile</h2><p class="muted">Update the information other parts of Chess Mastery use to identify your account.</p><input id="pn" value="'+(me.name||'')+'" placeholder="Your name"><input id="pch" value="'+(me.chess_username||'')+'" placeholder="Lichess / Chess.com username"><input id="pco" value="'+(me.contact||'')+'" placeholder="WhatsApp / contact"><div class="row"><button onclick="saveProfile()">Save changes</button><button onclick="document.getElementById('profileCard').remove()">Cancel</button></div></div>')}
async function saveProfile(){try{let x=await A('/api/profile',{method:'PUT',body:JSON.stringify({name:pn.value,chess_username:pch.value,contact:pco.value})});me=x.user;render()}catch(e){alert(e.message)}}
let board=null,positions=[],sans=[],ply=0;
async function openC(id){let c=await A('/api/courses/'+id);let first=c.chapters.find(x=>!x.locked);document.getElementById('app').innerHTML='<button onclick="render()">← Back</button><div class="card"><h2>'+c.title+'</h2><p>'+c.description+'</p><div class="courseView"><div class="boardPanel"><div id="board" class="board"></div><div class="row"><button onclick="go(0)">⏮</button><button onclick="go(ply-1)">◀ Prev</button><button onclick="go(ply+1)">Next ▶</button><button onclick="go(positions.length-1)">⏭</button></div><p id="counter" class="muted"></p></div><div><h3>First 30 full moves</h3><div id="moves" class="moves"></div></div></div></div>';if(!first){document.getElementById('moves').innerHTML='<p>🔒 Course locked. <button onclick="buyCourse('+id+')">Pay with PayPal</button></p>';return}setupBoard(first.pgn)}
function setupBoard(pgn){let g=new Chess();positions=[g.fen()];sans=[];for(const x of String(pgn||'').split(/\s+/)){if(!x||/^\d+\.(\.\.)?$/.test(x)||/^(1-0|0-1|1\/2-1\/2|\*)$/.test(x))continue;try{let m=g.move(x,{sloppy:true});if(m){sans.push(m.san);positions.push(g.fen())}}catch(e){}}positions=positions.slice(0,61);sans=sans.slice(0,60);ply=0;renderBoard(positions[0]);drawMoves();updateBoard()}
function renderBoard(fen){let el=document.getElementById('board');if(!el)return;let map={'p':'♟','r':'♜','n':'♞','b':'♝','q':'♛','k':'♚','P':'♙','R':'♖','N':'♘','B':'♗','Q':'♕','K':'♔'};let rows=fen.split(' ')[0].split('/');let html='';for(let r=0;r<8;r++){let file=0;for(const ch of rows[r]){if(/\d/.test(ch)){for(let z=0;z<Number(ch);z++){html+=sqHtml(r,file,'');file++}}else{html+=sqHtml(r,file,map[ch]||'');file++}}}el.innerHTML='<div class="realBoard">'+html+'</div>'}
function sqHtml(r,f,p){let label=(f===0?'<span class="rankLabel">'+(8-r)+'</span>':'')+(r===7?'<span class="fileLabel">'+String.fromCharCode(97+f)+'</span>':'');let pc=p?'<span class="'+(p===p.toUpperCase()?'piece-white':'piece-black')+'">'+p+'</span>':'';return '<div class="sq '+((r+f)%2?'dark':'light')+'">'+label+pc+'</div>'}
function go(n){ply=Math.max(0,Math.min(n,positions.length-1));updateBoard()}
function updateBoard(){if(positions[ply])renderBoard(positions[ply]);let c=document.getElementById('counter');if(c)c.textContent='Move '+Math.ceil(ply/2)+' · '+ply+' ply · up to 30 full moves';drawMoves()}
function drawMoves(){let e=document.getElementById('moves');if(!e)return;let o='';sans.forEach((m,i)=>o+='<span class="move '+(ply===i+1?'active':'')+'" onclick="go('+(i+1)+')">'+(i%2===0?(Math.floor(i/2)+1)+'. ':'')+m+'</span> ');e.innerHTML=o}
async function buyCourse(id){try{let o=await A('/api/paypal/create-order',{method:'POST',body:JSON.stringify({course_id:id})});window.open('https://www.paypal.com/checkoutnow?token='+encodeURIComponent(o.id),'_blank')}catch(e){alert(e.message)}}
async function savePayPal(){try{await A('/api/admin/paypal',{method:'POST',body:JSON.stringify({client_id:pi.value,client_secret:ps.value,env:pe.value})});alert('PayPal settings saved')}catch(e){alert(e.message)}}
async function createC(){try{let x=await A('/api/admin/courses',{method:'POST',body:JSON.stringify({title:ct.value,description:cd.value,price_cents:Number(cp.value)*100,free_chapters:Number(cf.value),pgn:pg.value})});alert('Created '+x.chapters+' chapters');render()}catch(e){alert(e.message)}}
render();
</script></body></html>
