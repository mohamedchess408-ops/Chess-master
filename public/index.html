<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Mastery</title>
<style>
:root{--bg:#07111d;--panel:#101d2d;--panel2:#0b1725;--line:#24364d;--text:#f4f7fb;--muted:#91a3b8;--green:#39b978;--gold:#e6bd68;--blue:#5aa7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#17304b 0,#07111d 42%,#050b12 100%);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;min-height:100vh}
header{max-width:1180px;margin:auto;padding:26px 22px 10px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#38b978,#2477d4);font-size:27px;box-shadow:0 8px 25px #0006}.brand h1{margin:0;font-size:25px}.brand small{color:var(--muted)}
main{max-width:1180px;margin:auto;padding:12px 22px 60px}.hero{padding:34px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,#12283c,#0c1725 60%,#10233a);box-shadow:0 20px 60px #0005}.hero h2{font-size:34px;margin:0 0 8px}.hero p{color:#afbed0;max-width:700px;font-size:16px;line-height:1.7}
.card{background:rgba(13,25,39,.94);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 12px 35px #0004}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.course{position:relative;overflow:hidden}.deleteCourseBtn{position:absolute;top:9px;right:9px;width:34px;height:34px;padding:0;border-radius:9px;background:#8f2638;color:#fff;font-size:17px;z-index:5;display:grid;place-items:center}.deleteCourseBtn:hover{filter:brightness(1.15)}.course:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--green),var(--blue),var(--gold))}.course h3{margin:4px 0 8px}.course p{color:var(--muted);min-height:42px}.price{font-size:21px;font-weight:800;color:var(--gold)}
button{border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(135deg,#36b875,#237b52);color:white;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.1)}button.secondary{background:#1a2b40;border:1px solid #34506e}button.danger{background:#7f3040}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}
input,textarea,select{width:100%;background:#08121e;color:white;border:1px solid #2b4058;border-radius:10px;padding:12px;margin:6px 0 12px;outline:none}textarea{min-height:180px}input:focus,textarea:focus,select:focus{border-color:#5aa7ff;box-shadow:0 0 0 3px #5aa7ff18}
.auth{max-width:760px;margin:22px auto}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{background:#142438}.tab.active{background:#2b78ba}.hide{display:none}
.welcome{background:linear-gradient(135deg,#123b34,#10283c);border-color:#2b735c}.welcome h2{margin-top:0}.stat{padding:13px 15px;background:#071521aa;border:1px solid #294157;border-radius:12px}.stat b{display:block;color:white;margin-top:4px}
.admin{border-color:#6a5530;background:linear-gradient(135deg,#1b1a14,#101b27)}
.boardWrap{display:grid;grid-template-columns:minmax(300px,560px) minmax(250px,1fr);gap:22px;align-items:start}.boardCard{background:#08131f;border:1px solid #294057;border-radius:18px;padding:15px}.board{width:440px;max-width:100%;aspect-ratio:1/1;margin:auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:6px solid #24160e;border-radius:5px;overflow:hidden;box-shadow:0 10px 22px #0009;background:#333;opacity:1}.sq{position:relative;min-width:0;min-height:0;width:100%;height:100%;display:grid;place-items:center;font-size:clamp(24px,5vw,50px);line-height:1;font-family:"Noto Sans Symbols 2","Segoe UI Symbol",DejaVu Sans,sans-serif}.light{background:#f0f0f0}.dark{background:#333}.whitePiece{color:#fff;-webkit-text-stroke:2px #000;text-shadow:0 3px 5px #000c;paint-order:stroke fill}.blackPiece{color:#000;-webkit-text-stroke:2px #fff;text-shadow:0 3px 5px #000c;paint-order:stroke fill}.coord{position:absolute;font:700 10px Arial;opacity:.85}.rank{left:4px;top:3px}.file{right:4px;bottom:3px}.light .coord{color:#555}.dark .coord{color:#eee}
.moves{max-height:500px;overflow:auto;background:#07111b;border:1px solid #25394e;border-radius:12px;padding:12px;line-height:2}.move{display:inline-block;padding:2px 6px;border-radius:6px;cursor:pointer}.move:hover,.move.active{background:#285a47;color:#fff}.chapter{padding:13px;border:1px solid #294057;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.locked{opacity:.7}
#paypalButtons{margin-top:12px;min-height:45px}
footer{text-align:center;color:#667b91;padding:20px}
@media(max-width:850px){header{padding:18px 14px}main{padding:10px 14px 40px}.hero{padding:24px}.hero h2{font-size:27px}.boardWrap{grid-template-columns:1fr}.board{width:400px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">♞</div><div><h1>Chess Mastery</h1><small>Learn. Practice. Improve.</small></div></div><div id="top"></div></header>
<main id="app"></main><footer>Chess Mastery • Your personal chess training platform</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
let me=null,courses=[],positions=[],sans=[],ply=0,currentCourse=null;
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Something went wrong');return j}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function load(){try{me=(await api('/api/me')).user;courses=await api('/api/courses');draw()}catch(e){$('app').innerHTML='<div class="card"><h2>Chess Mastery is starting...</h2><p class="muted">'+esc(e.message)+'</p><button onclick="load()">Retry</button></div>'}}
function draw(){ $('top').innerHTML=me?'<span class="muted">Hi, '+esc(me.name)+'</span>':'<span class="muted">Guest</span>';
let hero=me?'<section class="welcome card"><h2>♟ Welcome back, '+esc(me.name)+'!</h2><p>Your account is ready. Explore your courses, study interactive games, and continue improving your chess.</p><div class="row"><div class="stat">Chess username<b>'+esc(me.chess_username||'Not added')+'</b></div><div class="stat">Contact<b>'+esc(me.contact||'Not added')+'</b></div><div class="stat">Account<b>'+esc(me.role==='admin'?'Administrator':'Member')+'</b></div></div><div class="row" style="margin-top:15px"><button onclick="profile()">✏ Edit profile</button><button class="secondary" onclick="logout()">Log out</button></div></section>':'<section class="hero"><h2>Master your chess, one game at a time.</h2><p>Create your account to access free lessons and unlock full courses when you purchase them.</p><button onclick="authBox()">Get started</button></section>';
$('app').innerHTML=hero+'<section><div class="row" style="justify-content:space-between"><h2>Courses</h2><span class="muted">'+courses.length+' available</span></div><div class="grid">'+courses.map(c=>'<div class="card course">'+(me && me.role==='admin'?'<button class="deleteCourseBtn" title="Delete course" onclick="deleteCourse('+c.id+');return false">🗑</button>':'')+'<h3>'+esc(c.title)+'</h3><p>'+esc(c.description||'Interactive chess training course.')+'</p><div class="row"><span class="price">'+(c.price_cents?'$'+(c.price_cents/100).toFixed(2):'Free')+'</span><span class="muted">'+c.chapter_count+' chapters</span></div><br><button onclick="openCourse('+c.id+')">Open course</button></div>').join('')+'</div></section>'+(me?.role==='admin'?adminBox():'');
}
function authBox(){ $('app').innerHTML='<div class="auth card"><div class="tabs"><button id="lt" class="tab active" onclick="authTab(0)">Login</button><button id="rt" class="tab" onclick="authTab(1)">Create account</button></div><div id="login"><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Login</button></div><div id="register" class="hide"><input id="rn" placeholder="Full name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password (8+ characters)"><input id="rch" placeholder="Lichess / Chess.com username"><input id="rco" placeholder="WhatsApp / contact"><button onclick="register()">Create my account</button></div></div>'}
function authTab(n){$('login').classList.toggle('hide',n);$('register').classList.toggle('hide',!n);$('lt').classList.toggle('active',!n);$('rt').classList.toggle('active',n)}
async function login(){try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('le').value,password:$('lp').value})});await load()}catch(e){alert(e.message)}}
async function register(){try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:$('rn').value,email:$('re').value,password:$('rp').value,chess_username:$('rch').value,contact:$('rco').value})});await load()}catch(e){alert(e.message)}}
async function logout(){await api('/api/auth/logout',{method:'POST'});await load()}
function profile(){$('app').insertAdjacentHTML('afterbegin','<div class="card" id="profile"><h2>✏ Edit your profile</h2><p class="muted">Keep your chess username and contact details up to date.</p><input id="pn" value="'+esc(me.name)+'" placeholder="Name"><input id="pch" value="'+esc(me.chess_username)+'" placeholder="Lichess / Chess.com username"><input id="pc" value="'+esc(me.contact)+'" placeholder="Contact"><div class="row"><button onclick="saveProfile()">Save changes</button><button class="secondary" onclick="profile.remove()">Cancel</button></div></div>')}
async function saveProfile(){try{await api('/api/profile',{method:'PUT',body:JSON.stringify({name:$('pn').value,chess_username:$('pch').value,contact:$('pc').value})});await load()}catch(e){alert(e.message)}}
function adminBox(){return '<section class="card admin"><h2>⚙ Admin Center</h2><p class="muted">Create courses, manage members, and connect PayPal.</p><h3>Create course</h3><input id="ct" placeholder="Course title"><input id="cd" placeholder="Short description"><div class="row"><input id="cp" type="number" step=".01" value="29.99" placeholder="Price USD"><input id="cf" type="number" min="0" value="1" placeholder="Free chapters"></div><textarea id="pg" placeholder="Paste the full PGN from your Lichess study here"></textarea><button onclick="createCourse()">Create course</button><hr><h3>PayPal</h3><input id="pi" placeholder="PayPal Client ID"><input id="ps" type="password" placeholder="PayPal Client Secret"><select id="pe"><option value="sandbox">Sandbox</option><option value="live">Live</option></select><button onclick="savePayPal()">Save PayPal settings</button><button class="secondary" onclick="loadAdmin()">Manage members</button><div id="adminInfo"></div><h3 style="margin-top:20px">Course management</h3><div id="courseAdminList"></div></section>'}
async function createCourse(){try{const x=await api('/api/admin/courses',{method:'POST',body:JSON.stringify({title:$('ct').value,description:$('cd').value,price_cents:Number($('cp').value),free_chapters:Number($('cf').value),pgn:$('pg').value})});alert('Course created: '+x.chapters+' chapters');load()}catch(e){alert(e.message)}}
async function savePayPal(){try{await api('/api/admin/paypal',{method:'POST',body:JSON.stringify({client_id:$('pi').value,client_secret:$('ps').value,env:$('pe').value})});alert('PayPal connected. Customers can now pay for paid courses.')}catch(e){alert(e.message)}}
async function loadAdmin(){try{const x=await api('/api/admin/users');$('adminInfo').innerHTML='<h3>Members</h3>'+x.users.map(u=>'<div class="chapter"><span><b>'+esc(u.name)+'</b><br><small class="muted">'+esc(u.email)+' • '+esc(u.chess_username||'No chess username')+'</small></span><span>'+esc(u.role)+'</span></div>').join('')}catch(e){alert(e.message)}try{const cs=await api('/api/courses');$('courseAdminList').innerHTML=cs.length?cs.map(c=>'<div class="chapter"><span><b>'+esc(c.title)+'</b><br><small class="muted">'+c.chapter_count+' chapters</small></span><button class="danger" onclick="deleteCourse('+c.id+')">Delete</button></div>').join(''):'<p class="muted">No courses yet.</p>'}catch(e){alert(e.message)}}
async function deleteCourse(id){if(!confirm('Delete this course?'))return;try{await api('/api/admin/courses/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}
async function openCourse(id){currentCourse=await api('/api/courses/'+id);$('app').innerHTML='<button class="secondary" onclick="load()">← Back to courses</button><div class="card"><h2>'+esc(currentCourse.title)+'</h2><p class="muted">'+esc(currentCourse.description)+'</p><div class="boardWrap"><div class="boardCard"><div id="board" class="board"></div><div class="row" style="justify-content:center;margin-top:13px"><button onclick="go(0)">⏮ Start</button><button class="secondary" onclick="go(ply-1)">◀ Prev</button><button onclick="go(ply+1)">Next ▶</button><button class="secondary" onclick="go(positions.length-1)">End ⏭</button></div><p id="counter" class="muted" style="text-align:center"></p></div><div><h3>Chapters</h3><div>'+currentCourse.chapters.map(ch=>'<div class="chapter '+(ch.locked?'locked':'')+'"><span><b>'+esc(ch.title)+'</b><br><small class="muted">'+(ch.locked?'🔒 Locked':'▶ Available')+'</small></span>'+(ch.locked?'<button onclick="pay('+id+')">Unlock</button>':'<button onclick="chapter('+ch.id+')">Open</button>')+'</div>').join('')+'</div><div class="card" style="margin-top:14px"><h3>Moves</h3><div id="moves" class="moves"></div></div><div id="paypalButtons"></div></div></div></div>';const first=currentCourse.chapters.find(x=>!x.locked);if(first)setup(first.pgn);else $('board').innerHTML='<div style="display:grid;place-items:center;height:100%;padding:30px;text-align:center;background:#102033">🔒<br>Unlock this course to continue.</div>'}
function chapter(id){const ch=currentCourse.chapters.find(x=>x.id===id);if(ch&&!ch.locked)setup(ch.pgn)}
function setup(pgn){const g=new Chess();positions=[g.fen()];sans=[];for(const token of String(pgn||'').split(/\s+/)){if(!token||/^\d+\.(\.\.)?$/.test(token)||/^(1-0|0-1|1\/2-1\/2|\*)$/.test(token))continue;try{const m=g.move(token,{sloppy:true});if(m){sans.push(m.san);positions.push(g.fen())}}catch{}}positions=positions.slice(0,41);sans=sans.slice(0,40);ply=0;update()}
function boardHtml(fen){const map={p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',P:'♙',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔'};const rows=fen.split(' ')[0].split('/');let h='';for(let r=0;r<8;r++){let f=0;for(const c of rows[r]){if(/\d/.test(c)){for(let z=0;z<+c;z++,f++)h+=sq(r,f,'')}else h+=sq(r,f++,map[c])}}return h}
function sq(r,f,p){return '<div class="sq '+((r+f)%2?'dark':'light')+'">'+(f===0?'<span class="coord rank">'+(8-r)+'</span>':'')+(r===7?'<span class="coord file">'+String.fromCharCode(97+f)+'</span>':'')+(p?'<span class="'+(p===p.toUpperCase()?'whitePiece':'blackPiece')+'">'+p+'</span>':'')+'</div>'}
function go(n){ply=Math.max(0,Math.min(Number(n),positions.length-1));update()}
function update(){if($('board'))$('board').innerHTML=boardHtml(positions[ply]);if($('counter'))$('counter').textContent='Position '+ply+' / '+(positions.length-1)+' • First 20 full moves';if($('moves'))$('moves').innerHTML=sans.map((m,i)=>'<span class="move '+(ply===i+1?'active':'')+'" onclick="go('+(i+1)+')">'+(i%2===0?(Math.floor(i/2)+1)+'. ':'')+m+'</span>').join(' ')}
async function pay(id){if(!me){authBox();return}try{const cfg=await api('/api/paypal/config');if(!cfg.configured){alert('PayPal is not configured yet. The admin must connect PayPal first.');return}const order=await api('/api/paypal/create-order',{method:'POST',body:JSON.stringify({course_id:id})});window.location.href='https://www.paypal.com/checkoutnow?token='+encodeURIComponent(order.id)}catch(e){alert(e.message)}}
load();
</script>
</body></html>
