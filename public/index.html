<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Mastery</title>
<style>
body{font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#080d18,#111a2d);color:#eef;max-width:1180px;margin:auto;padding:28px}h1{font-size:34px;margin-bottom:4px}h2{margin-top:10px}.card{background:rgba(21,29,51,.92);padding:22px;border-radius:16px;margin:14px 0;box-shadow:0 12px 35px #0005;border:1px solid #263454}
.card{background:#151d33;padding:20px;border-radius:14px;margin:14px 0;box-shadow:0 8px 30px #0003}
button{padding:10px 14px;border:0;border-radius:9px;background:#7357ff;color:white;font-weight:bold;cursor:pointer}
input,textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;background:#0d1426;color:white;border:1px solid #33405e;border-radius:8px}
.muted{color:#9aa8c2}.row{display:flex;gap:10px;flex-wrap:wrap}.chapter{padding:10px;border:1px solid #33405e;border-radius:8px;margin:7px 0}
</style><style>
.courseView{display:grid;grid-template-columns:minmax(360px,560px) minmax(280px,1fr);gap:30px;align-items:start}
.board{width:min(560px,100%);margin:auto}
.moves{max-height:520px;overflow:auto;background:#161b22;padding:16px;border-radius:12px;border:1px solid #30363d}
.move{display:inline-block;padding:7px 9px;border-radius:7px;cursor:pointer;font-family:monospace}
.move:hover{background:#21262d}.move.active{background:#629924;color:#fff}
.realBoard{width:100%;aspect-ratio:1;border:10px solid #24170f;border-radius:10px;overflow:hidden;display:grid;grid-template-columns:repeat(8,1fr);box-shadow:0 22px 55px #000b,0 0 0 2px #6f4930 inset,0 0 0 5px #120b08;box-sizing:border-box}
.sq{display:flex;align-items:center;justify-content:center;position:relative;font-size:clamp(38px,7vw,76px);line-height:1;user-select:none;font-family:"Noto Sans Symbols 2","Segoe UI Symbol",serif;transition:filter .12s,transform .12s}
.light{background:linear-gradient(135deg,#f3d7a0 0%,#d9b477 100%)}.dark{background:linear-gradient(135deg,#a66b3f 0%,#7b482b 100%)}
.sq:hover{filter:brightness(1.08)}
.piece-white{color:#fff8e7;text-shadow:0 2px 0 #b59b76,0 4px 8px #0009}
.piece-black{color:#21150f;text-shadow:0 2px 1px #000,0 4px 7px #0008}
.fileLabel,.rankLabel{font-size:11px;position:absolute;font-family:Arial,sans-serif;font-weight:800;opacity:.85;text-shadow:none}
.light .fileLabel,.light .rankLabel{color:#7b482b}.dark .fileLabel,.dark .rankLabel{color:#f3d7a0}
.rankLabel{top:3px;left:5px}.fileLabel{bottom:3px;right:5px}
@media(max-width:800px){.courseView{grid-template-columns:1fr}.board{max-width:560px}}
</style></head><body><h1>♟ Chess Mastery</h1><p class="muted">Your chess training platform.</p><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script>
let me=null;
const A=async(u,o={})=>{let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j};
async function render(){
 me=(await A('/api/me')).user;let c=await A('/api/courses');
 document.getElementById('app').innerHTML=(me?'<p>Welcome, '+me.name+' <button onclick="logout()">Logout</button></p>':'<div class="card"><h2>Login</h2><input id="e" placeholder="Email"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button><h2>Register</h2><input id="n" placeholder="Name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password (8+)"><input id="ch" placeholder="Lichess / Chess.com username"><input id="co" placeholder="WhatsApp / contact"><button onclick="reg()">Create account</button></div>')
 +'<h2>Courses</h2>'+c.map(x=>'<div class="card"><h3>'+x.title+'</h3><p>'+x.description+'</p><b>$'+(x.price_cents/100).toFixed(2)+'</b><p>'+x.chapter_count+' chapters</p><button onclick="openC('+x.id+')">Open</button></div>').join('')
 +(me?.role==='admin'?'<div class="card"><h2>Admin</h2><h3>PayPal Settings</h3><p class="muted">Add your PayPal app credentials here. They are stored server-side and never shown back.</p><input id="pi" placeholder="PayPal Client ID"><input id="ps" type="password" placeholder="PayPal Client Secret"><select id="pe"><option value="sandbox">Sandbox</option><option value="live">Live</option></select><button onclick="savePayPal()">Save PayPal</button><div id="ppstatus"></div><hr><h2>Courses</h2><input id="ct" placeholder="Course title"><input id="cd" placeholder="Description"><input id="cp" type="number" step=".01" value="29.99"><input id="cf" type="number" value="1"><textarea id="pg" placeholder="Paste PGN"></textarea><button onclick="createC()">Create course</button></div>':'');
}
async function login(){try{await A('/api/auth/login',{method:'POST',body:JSON.stringify({email:e.value,password:p.value})});render()}catch(x){alert(x.message)}}
async function reg(){try{await A('/api/auth/register',{method:'POST',body:JSON.stringify({name:n.value,email:re.value,password:rp.value,chess_username:ch.value,contact:co.value})});render()}catch(x){alert(x.message)}}
async function logout(){await A('/api/auth/logout',{method:'POST'});render()}
let board=null,positions=[],sans=[],ply=0;
async function openC(id){let c=await A('/api/courses/'+id);let first=c.chapters.find(x=>!x.locked);document.getElementById('app').innerHTML='<button onclick="render()">← Back</button><div class="card"><h2>'+c.title+'</h2><p>'+c.description+'</p><div class="courseView"><div><div id="board" class="board"></div><div class="row"><button onclick="go(0)">⏮</button><button onclick="go(ply-1)">◀ Prev</button><button onclick="go(ply+1)">Next ▶</button><button onclick="go(positions.length-1)">⏭</button></div><p id="counter" class="muted"></p></div><div><h3>First 30 full moves</h3><div id="moves" class="moves"></div></div></div></div>';if(!first){document.getElementById('moves').innerHTML='<p>🔒 Course locked. <button onclick="buyCourse('+id+')">Pay with PayPal</button></p>';return}setupBoard(first.pgn)}
function setupBoard(pgn){let g=new Chess();positions=[g.fen()];sans=[];for(const x of String(pgn||'').split(/\s+/)){if(!x||/^\d+\.(\.\.)?$/.test(x)||/^(1-0|0-1|1\/2-1\/2|\*)$/.test(x))continue;try{let m=g.move(x,{sloppy:true});if(m){sans.push(m.san);positions.push(g.fen())}}catch(e){}}positions=positions.slice(0,61);sans=sans.slice(0,60);ply=0;renderBoard(positions[0]);drawMoves();updateBoard()}
function renderBoard(fen){let el=document.getElementById('board');if(!el)return;let map={'p':'♟','r':'♜','n':'♞','b':'♝','q':'♛','k':'♚','P':'♙','R':'♖','N':'♘','B':'♗','Q':'♕','K':'♔'};let rows=fen.split(' ')[0].split('/');let html='';for(let r=0;r<8;r++){let file=0;for(const ch of rows[r]){if(/\d/.test(ch)){for(let z=0;z<Number(ch);z++){html+=sqHtml(r,file,'');file++}}else{html+=sqHtml(r,file,map[ch]||'');file++}}}el.innerHTML='<div class="realBoard">'+html+'</div>'}
function sqHtml(r,f,p){let label=(f===0?'<span class="rankLabel">'+(8-r)+'</span>':'')+(r===7?'<span class="fileLabel">'+String.fromCharCode(97+f)+'</span>':'');let pc=p?'<span class="'+(p===p.toUpperCase()?'piece-white':'piece-black')+'">'+p+'</span>':'';return '<div class="sq '+((r+f)%2?'dark':'light')+'">'+label+pc+'</div>'}
function go(n){ply=Math.max(0,Math.min(n,positions.length-1));updateBoard()}
function updateBoard(){if(positions[ply])renderBoard(positions[ply]);let c=document.getElementById('counter');if(c)c.textContent='Move '+Math.ceil(ply/2)+' · '+ply+' ply · up to 30 full moves';drawMoves()}
function drawMoves(){let e=document.getElementById('moves');if(!e)return;let o='';sans.forEach((m,i)=>o+='<span class="move '+(ply===i+1?'active':'')+'" onclick="go('+(i+1)+')">'+(i%2===0?(Math.floor(i/2)+1)+'. ':'')+m+'</span> ');e.innerHTML=o}
async function buyCourse(id){try{let o=await A('/api/paypal/create-order',{method:'POST',body:JSON.stringify({course_id:id})});window.open('https://www.paypal.com/checkoutnow?token='+encodeURIComponent(o.id),'_blank')}catch(e){alert(e.message)}}
async function savePayPal(){try{await A('/api/admin/paypal',{method:'POST',body:JSON.stringify({client_id:pi.value,client_secret:ps.value,env:pe.value})});alert('PayPal settings saved')}catch(e){alert(e.message)}}
async function createC(){try{let x=await A('/api/admin/courses',{method:'POST',body:JSON.stringify({title:ct.value,description:cd.value,price_cents:Number(cp.value)*100,free_chapters:Number(cf.value),pgn:pg.value})});alert('Created '+x.chapters+' chapters');render()}catch(e){alert(e.message)}}
render();
</script></body></html>
